services:
  app:
    build: .
    ports:
      # Bound to localhost only — put Nginx (or another reverse proxy) in
      # front on 80/443 rather than exposing plain HTTP on 3000 publicly.
      - "127.0.0.1:3000:3000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      DATABASE_URL: "file:/app/data/prod.db"
      ANALYZE_RATE_LIMIT_PER_MINUTE: ${ANALYZE_RATE_LIMIT_PER_MINUTE:-20}
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env, e.g. via openssl rand -base64 32}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:?set NEXTAUTH_URL in .env, e.g. https://yourdomain.com}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - db-data:/app/data
    restart: unless-stopped

volumes:
  db-data:
