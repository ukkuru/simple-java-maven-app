# Reverse proxy for the User Story Quality Analyzer Docker container.
#
# Usage (on the VPS):
#   1. Replace yourdomain.com below with your real domain.
#   2. cp deploy/nginx.conf /etc/nginx/sites-available/user-story-analyzer
#   3. ln -s /etc/nginx/sites-available/user-story-analyzer /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d yourdomain.com   (issues HTTPS + rewrites this file
#      to redirect :80 -> :443 automatically; safe to run after step 4)

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
